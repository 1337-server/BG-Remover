name: Build and Release BG-Remover (GUI)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release BG-Remover
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            ext: exe
            pyinstaller_opts: '--onefile --noconsole --icon assets/icon.ico'
          - os: ubuntu-latest
            ext: ''
            pyinstaller_opts: '--onefile --noconsole'
          - os: macos-latest
            ext: ''
            pyinstaller_opts: '--onefile --noconsole --icon assets/icon.icns'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller upx

      - name: Build executable
        run: |
          python build_executable.py --onefile --name "BG-Remover" || \
          pyinstaller runtimes/gui/bg_remover_gui.py ${{ matrix.pyinstaller_opts }} --name "BG-Remover"

      - name: List build output
        run: ls -R dist || dir dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BG-Remover-${{ runner.os }}
          path: |
            dist/BG-Remover${{ matrix.ext }}
            dist/BG-Remover/*

  release:
    needs: build-and-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BG-Remover ${{ github.ref_name }}
          files: |
            dist/BG-Remover-windows/BG-Remover.exe
            dist/BG-Remover-ubuntu/BG-Remover
            dist/BG-Remover-macos/BG-Remover
