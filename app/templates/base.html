<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Background Remover{% endblock %}</title>
    <script>
      /**
       * Ensure the stored theme preference is applied before the first paint to prevent flashes.
       */
      (() => {
        const THEME_STORAGE_KEY = 'bg-remover-theme';
        const prefersDarkScheme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const storedTheme = window.localStorage ? localStorage.getItem(THEME_STORAGE_KEY) : null;
        const resolvedTheme = storedTheme === 'dark' || storedTheme === 'light' ? storedTheme : (prefersDarkScheme ? 'dark' : 'light');
        const rootElement = document.documentElement;

        rootElement.setAttribute('data-bs-theme', resolvedTheme);
        rootElement.style.colorScheme = resolvedTheme;
      })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/base.css') }}" rel="stylesheet">
    {% block extra_head %}{% endblock %}
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">BG Remover</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('image_converter.remove_bg_view') }}">Remove Background</a>
            </li>
          </ul>
          <div class="d-flex">
            <button class="btn btn-outline-light" id="theme-toggle" type="button" aria-pressed="false">Switch to dark mode</button>
          </div>
        </div>
      </div>
    </nav>
    <main class="container py-4">
      {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const themeToggleButton = document.getElementById('theme-toggle');

        if (!themeToggleButton) {
          return;
        }

        const THEME_STORAGE_KEY = 'bg-remover-theme';
        const rootElement = document.documentElement;

        /**
         * Apply the requested theme to the root element and update the toggle button label.
         * @param {string | null} themeName - The desired theme name, "light" or "dark".
         */
        const applyTheme = (themeName) => {
          // Ensure an expected value is always set on the root element.
          const resolvedTheme = themeName === 'dark' ? 'dark' : 'light';
          rootElement.setAttribute('data-bs-theme', resolvedTheme);
          rootElement.style.colorScheme = resolvedTheme;
          themeToggleButton.setAttribute('aria-pressed', String(resolvedTheme === 'dark'));
          themeToggleButton.textContent = resolvedTheme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
        };

        // Load the previously stored theme preference, if any, otherwise fall back to light mode.
        const storedTheme = localStorage.getItem(THEME_STORAGE_KEY);
        applyTheme(storedTheme);

        themeToggleButton.addEventListener('click', () => {
          const currentTheme = rootElement.getAttribute('data-bs-theme') === 'dark' ? 'dark' : 'light';
          const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';

          applyTheme(nextTheme);
          localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
        });
      });
    </script>
    {% block extra_scripts %}{% endblock %}
  </body>
</html>
