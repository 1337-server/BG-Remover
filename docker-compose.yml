version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    environment:
      - PORT=5000
      - BG_ACCELERATOR=auto
    ports:
      - "5000:5000"

  app-gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    environment:
      - PORT=5000
      - BG_ACCELERATOR=auto
    ports:
      - "5000:5000"
    gpus: all
    profiles:
      - gpu
