<!doctype html>
<html lang="en" class="min-h-full">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>{% block title %}Background Remover{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
    />
    <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:wght@400;500&display=swap"
            rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('webui.static', filename='css/tailwind.min.css') }}"/>
    <link rel="stylesheet" href="{{ url_for('webui.static', filename='css/app.css') }}"/>
    <link rel="stylesheet" href="{{ url_for('webui.static', filename='css/base.css') }}"/>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/icon.png') }}">

    <script src="{{ url_for('webui.static', filename='js/theme.js') }}"></script>
    <script src="{{ url_for('webui.static', filename='js/app.js') }}" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.4/dist/cdn.min.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.bgrApp && window.Alpine) {
                console.log('✅ bgrApp detected, starting Alpine...');
                window.Alpine.start();
            }
        });
    </script>
</head>

<body class="app-body">
<div
        id="app-root"
        class="app-shell"
        data-config='{
        "badge_label": {{ badge_label|tojson }},
        "providers": {{ providers|tojson }},
        "model_options": {{ model_options|tojson }},
        "default_model": {{ default_model|tojson }},
        "model_dir": {{ model_dir|tojson }},
        "model_specs": {{ model_specs|tojson }}
      }'
        x-data="bgrApp($el.dataset.config)"
        x-init="init()">
    {% set current_page = active_page|default('single') %}
    <header class="app-navbar backdrop-blur">
        <div class="max-w-7xl mx-auto px-6 py-4 space-y-4">
            <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
                <div class="flex items-center gap-3">
                    <div class="app-logo" aria-hidden="true">BGR</div>
                    <div>
                        <h1 class="text-lg font-semibold">Background Remover</h1>
                        <p class="text-sm app-text-muted">Smart background removal for images and folders</p>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2">
                        <span class="text-sm app-text-muted">Runtime</span>
                        <span :class="providerPillClass" x-text="providerPill"></span>
                    </div>
                    <button
                            type="button"
                            class="theme-toggle"
                            @click="toggleTheme()"
                    >
                        <span class="material-symbols-rounded text-base" aria-hidden="true">contrast</span>
                        <span x-text="themeLabel"></span>
                    </button>
                </div>
            </div>
            <nav class="app-nav">
                <a
                        href="{{ url_for('webui.single') }}"
                        class="nav-link {{ 'nav-link--active' if current_page == 'single' else '' }}"
                        {% if current_page == 'single' %}aria-current="page"{% endif %}
                >Single Image</a>
                <a
                        href="{{ url_for('webui.batch_page') }}"
                        class="nav-link {{ 'nav-link--active' if current_page == 'batch' else '' }}"
                        {% if current_page == 'batch' %}aria-current="page"{% endif %}
                >Batch Processing</a>
            </nav>
        </div>
    </header>
    <main class="flex-1">
        <div class="max-w-7xl mx-auto px-6 py-8">
            {% block content %}{% endblock %}
        </div>
    </main>
    <footer class="app-footer">
        <div class="max-w-7xl mx-auto px-6 py-4 text-sm app-text-muted flex flex-wrap items-center justify-between gap-2">
            <span>&copy; {{ current_year }} Background Remover</span>
            <div class="flex gap-4">
                <a href="https://github.com/" target="_blank" rel="noopener" class="app-link">Project
                    Wiki</a>
                <a href="{{ url_for('webui.history') }}" class="app-link">API History</a>
            </div>
        </div>
    </footer>
</div>
<div id="toast-container" class="fixed top-6 right-6 space-y-3 z-50"></div>
<script>
    document.addEventListener("alpine:init", () => {
        Alpine.data('submitFab', () => ({
            showFab: false,
            _obs: null,

            init() {
                const btn = this.$refs.submitBtn;
                if (!btn) return;
                this._obs = new IntersectionObserver((entries) => {
                    const e = entries[0];
                    this.showFab = !e.isIntersecting; // show FAB when original is off-screen
                }, {root: null, threshold: 0.01});
                this._obs.observe(btn);
            },

            triggerSubmit() {
                // Dispatch submit on your existing form (adjust selector if needed)
                const form = document.querySelector('#process-form');
                if (form) {
                    form.dispatchEvent(new Event('submit', {cancelable: true, bubbles: true}));
                }
            },

            destroy() {
                this._obs && this._obs.disconnect();
            }
        }));
        Alpine.data("previewPanelState", () => ({
            open: true,

            init() {
                // Restore saved state
                const saved = localStorage.getItem("previewOpen");
                if (saved !== null) {
                    this.open = saved === "true";
                }

            },

            toggle() {
                this.open = !this.open;
                // Save state persistently
                localStorage.setItem("previewOpen", this.open);
            },
        }));
    });
</script>
</body>
</html>
