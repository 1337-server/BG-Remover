<section class="card" id="preview-card">
    <header class="flex items-center justify-between">
        <div>
            <h2 class="text-lg font-semibold">Live preview</h2>
            <p class="text-sm app-text-muted">Processed results appear here with download options.</p>
        </div>
        <div class="text-sm app-text-muted" x-show="previewItems.length">
            <span x-text="previewItems.length"></span> result<span x-show="previewItems.length > 1">s</span>
        </div>
    </header>
    <div class="mt-4 flex flex-wrap items-center justify-between gap-3">
        <div class="flex flex-wrap gap-2">
            <button type="button" class="btn-tertiary" @click="applyPreviewFill()">
                <span class="material-symbols-rounded text-base" aria-hidden="true">palette</span>
                Background Fill
            </button>
            <button type="button" class="btn-tertiary" @click="applyPreviewClear()">
                <span class="material-symbols-rounded text-base" aria-hidden="true">ink_eraser</span>
                Background Clear
            </button>

            <label class="field">
              <span class="field-label">Fill colour
                <span class="info-icon" :title="getOptionHelp('background_color')">i</span>
              </span>
                <input type="color" name="background_color" class="input h-10 w-16"
                       x-model="settings.background_color" @input="persistSettings()"/>
                <p class="field-help">Applies when background mode is set to Fill.</p>
            </label>
        </div>
        <div
                :class="statusClass()"
                role="status"
                aria-live="polite"
                aria-atomic="true"
                x-text="status.message"
        ></div>
    </div>
    <div class="mt-6 grid gap-4" x-show="previewItems.length">
        <template x-for="item in previewItems" :key="item.id">
            <article class="panel">
                <div class="grid md:grid-cols-2">
                    <div class="p-4">
                        <div :class="previewBackgroundClasses()" :style="previewContainerStyle()">
                            <img :src="item.preview_data_uri || `/result/${item.id}`"
                                 :alt="`Preview ${item.result_name}`" class="h-full w-full object-contain"/>
                        </div>
                    </div>
                    <div class="p-4 space-y-3">
                        <div>
                            <h3 class="font-semibold" x-text="item.result_name">Preview</h3>
                            <p class="text-sm app-text-muted" x-text="`Original: ${item.original_name}`"></p>
                        </div>
                        <dl class="grid grid-cols-2 gap-2 text-sm">
                            <div>
                                <dt class="app-text-muted">Model</dt>
                                <dd x-text="item.options.model_key"></dd>
                            </div>
                            <div>
                                <dt class="app-text-muted">Feather</dt>
                                <dd x-text="item.options.feather_radius"></dd>
                            </div>
                            <div>
                                <dt class="app-text-muted">Format</dt>
                                <dd x-text="item.options.output_format"></dd>
                            </div>
                            <div>
                                <dt class="app-text-muted">Size</dt>
                                <dd x-text="formatBytes(item.size_bytes)"></dd>
                            </div>
                        </dl>
                        <div class="flex flex-wrap gap-2 pt-2">
                            <a :href="`/download/${item.id}`" class="btn-secondary">
                                <span class="material-symbols-rounded text-base">download</span>
                                Download
                            </a>
                            <button type="button" class="btn-tertiary" @click="openInNewTab(item.id)">
                                <span class="material-symbols-rounded text-base">open_in_new</span>
                                Open
                            </button>
                            <button type="button" class="btn-tertiary" @click="removePreview(item.id)">
                                <span class="material-symbols-rounded text-base">delete</span>
                                Remove
                            </button>
                        </div>
                    </div>
                </div>
            </article>
        </template>
    </div>
    <div class="mt-6" x-show="!previewItems.length">
        <div class="empty-state">
            Processed images will appear here.
        </div>
    </div>
    <div class="mt-6">
        <h3 class="text-sm font-semibold app-text-muted">Activity log</h3>
        <ul class="mt-3 space-y-2 max-h-48 overflow-y-auto log-list">
            <template x-for="entry in activityLog" :key="entry.id">
                <li :class="entry.class">
                    <span class="material-symbols-rounded text-base" :class="entry.iconClass" aria-hidden="true"
                          x-text="entry.icon"></span>
                    <span x-text="entry.message"></span>
                </li>
            </template>
        </ul>
    </div>
</section>
