<!doctype html>
<html lang="en" class="min-h-full">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>{% block title %}Background Remover{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
    />
    <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:wght@400;500&display=swap"
            rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('webui.static', filename='css/tailwind.min.css') }}"/>
    <link rel="stylesheet" href="{{ url_for('webui.static', filename='css/app.css') }}"/>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">

    <script>
        const storedTheme = localStorage.getItem('bgr-theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (storedTheme === 'dark' || (!storedTheme && prefersDark)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <script src="{{ url_for('webui.static', filename='js/app.js') }}" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.4/dist/cdn.min.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.bgrApp && window.Alpine) {
                console.log('✅ bgrApp detected, starting Alpine...');
                window.Alpine.start();
            }
        });
    </script>
</head>
<body class="bg-slate-100 text-slate-900 dark:bg-slate-900 dark:text-slate-100 min-h-full">
<div
        id="app-root"
        class="min-h-screen flex flex-col"
        data-config='{
        "badge_label": {{ badge_label|tojson }},
        "providers": {{ providers|tojson }},
        "model_options": {{ model_options|tojson }},
        "default_model": {{ default_model|tojson }},
        "model_dir": {{ model_dir|tojson }},
        "model_specs": {{ model_specs|tojson }}
      }'
        x-data="bgrApp($el.dataset.config)"
        x-init="init()"
>
    <header class="border-b border-slate-200 bg-white/80 dark:border-slate-800 dark:bg-slate-900/60 backdrop-blur">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="h-10 w-10 rounded-full bg-indigo-500 text-white flex items-center justify-center font-semibold">
                    BGR
                </div>
                <div>
                    <h1 class="text-lg font-semibold">Background Remover</h1>
                    <p class="text-sm text-slate-500 dark:text-slate-400">Smart background removal for images and
                        folders</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2">
                    <span class="text-sm text-slate-500 dark:text-slate-400">Runtime</span>
                    <span :class="providerPillClass" x-text="providerPill"></span>
                </div>
                <button
                        type="button"
                        class="inline-flex items-center gap-2 rounded-full border border-slate-300/70 dark:border-slate-700 px-3 py-1 text-sm hover:bg-slate-100 dark:hover:bg-slate-800"
                        @click="toggleTheme()"
                >
                    <span class="material-symbols-rounded text-base" aria-hidden="true">contrast</span>
                    <span x-text="themeLabel"></span>
                </button>
            </div>
        </div>
    </header>
    <main class="flex-1">
        <div class="max-w-7xl mx-auto px-6 py-8">
            {% block content %}{% endblock %}
        </div>
    </main>
    <footer class="border-t border-slate-200 dark:border-slate-800 bg-white/70 dark:bg-slate-900/60">
        <div class="max-w-7xl mx-auto px-6 py-4 text-sm text-slate-500 dark:text-slate-400 flex flex-wrap items-center justify-between gap-2">
            <span>&copy; {{ current_year }} Background Remover</span>
            <div class="flex gap-4">
                <a href="https://github.com/" target="_blank" rel="noopener" class="hover:text-indigo-500">Project
                    Wiki</a>
                <a href="{{ url_for('webui.history') }}" class="hover:text-indigo-500">API History</a>
            </div>
        </div>
    </footer>
</div>
<div id="toast-container" class="fixed top-6 right-6 space-y-3 z-50"></div>
</body>
</html>
