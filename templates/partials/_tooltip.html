{% macro hint(identifier, label) %}
  <span class="relative inline-flex" data-tooltip-root>
    <button
      type="button"
      class="tooltip-trigger inline-flex h-7 w-7 items-center justify-center rounded-full border border-[var(--color-border-muted)] bg-[var(--color-surface-soft)] text-xs font-semibold text-[var(--color-text-muted)] transition hover:border-[var(--color-accent-strong)] hover:text-[var(--color-accent-strong)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-accent-strong)] focus-visible:ring-offset-2 focus-visible:ring-offset-[var(--color-surface-elevated)]"
      data-tooltip-trigger
      data-tooltip-id="{{ identifier }}"
      aria-describedby="{{ identifier }}"
      aria-expanded="false"
    >
      <span class="sr-only">{{ label }}</span>
      <span aria-hidden="true">?</span>
    </button>
    <span
      id="{{ identifier }}"
      class="tooltip-panel pointer-events-none absolute z-30 hidden max-w-xs rounded-lg border border-[var(--color-border-muted)] bg-[var(--color-surface-elevated)] px-4 py-3 text-left text-sm leading-relaxed text-[var(--color-text-muted)] shadow-lg"
      role="tooltip"
      data-tooltip-panel
    >
      {{ caller() }}
    </span>
  </span>
{% endmacro %}
